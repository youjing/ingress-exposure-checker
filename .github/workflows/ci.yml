name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel & sdist
        run: |
          pip install build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # 打 tag 时自动创建 GitHub Release 并附上构建产物
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  helm:
    # 校验 Helm chart: lint + 渲染 (默认值 / job 模式 / 凭据注入)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Lint
        run: helm lint k8s/charts/iec

      - name: Template (default cronjob)
        run: helm template iec k8s/charts/iec > /dev/null

      - name: Template (job mode)
        run: helm template iec k8s/charts/iec --set mode=job > /dev/null

      - name: Template (with credentials)
        run: |
          helm template iec k8s/charts/iec \
            --set slack.webhook="https://hooks.slack.com/services/T000/B000/X" \
            --set alertmanager.url="https://alertmanager.example.com" \
            --set alertmanager.password="dummy" | grep -q "kind: Secret"

  docker:
    # 构建集群扫描镜像 (iec + kubectl) 并推送到 GHCR
    # 集群拉取受限时可改为内网仓库: docker tag + push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/iec:latest

