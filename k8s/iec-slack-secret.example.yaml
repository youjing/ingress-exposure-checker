# Slack 凭据模板。复制为 iec-slack.yaml 填入真实值后:
#   kubectl apply -f iec-slack.yaml
# ⚠️ 真实 webhook/token 只存在于集群 Secret, 此文件(含占位符)才可入库
apiVersion: v1
kind: Secret
metadata:
  name: iec-slack
  namespace: default
stringData:
  SLACK_WEBHOOK: "https://hooks.slack.com/services/T0000000/B0000000/XXXXXXXXXXXXXXXXXXXXXXXX"
  SLACK_TOKEN: "xoxb-xxxxxxxxxxxx-xxxxxxxxxxxx-xxxxxxxxxxxxxxxxxxxxxxxx"
  SLACK_CHANNEL: "C0123ABCDEF"
