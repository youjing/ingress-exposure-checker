{{- if eq .Values.mode "cronjob" }}
{{/* CronJob API 版本自动探测: K8s >= 1.21 为 batch/v1, 旧集群 (< 1.21) 回退 batch/v1beta1 */}}
apiVersion: {{ if .Capabilities.APIVersions.Has "batch/v1/CronJob" }}batch/v1{{ else }}batch/v1beta1{{ end }}
kind: CronJob
metadata:
  name: {{ include "iec.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iec.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "iec.labels" . | nindent 12 }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "iec.fullname" . }}
          restartPolicy: {{ .Values.restartPolicy }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: iec
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              envFrom:
                {{- if or .Values.existingSecret (and .Values.secret.create (eq (include "iec.hasCredentials" .) "true")) }}
                - secretRef:
                    name: {{ include "iec.secretName" . }}
                {{- end }}
              env:
                - name: IEC_ENV_NAME
                  value: {{ .Values.scan.envName | quote }}
                - name: IEC_CONCURRENCY
                  value: {{ .Values.scan.concurrency | quote }}
                {{- if .Values.scan.exitZero }}
                - name: IEC_EXIT_ZERO
                  value: "1"
                {{- end }}
                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              {{- with .Values.nodeSelector }}
              nodeSelector:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.affinity }}
              affinity:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.tolerations }}
              tolerations:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
