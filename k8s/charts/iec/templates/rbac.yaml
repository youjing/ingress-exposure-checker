{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iec.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iec.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "iec.fullname" . }}
  labels:
    {{- include "iec.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "iec.fullname" . }}
  labels:
    {{- include "iec.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "iec.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iec.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
