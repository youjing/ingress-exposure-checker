{{- if and (not .Values.existingSecret) .Values.secret.create (eq (include "iec.hasCredentials" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iec.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iec.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $data := dict -}}
  {{- with .Values.slack.webhook -}}
    {{- $_ := set $data "SLACK_WEBHOOK" . -}}
  {{- end -}}
  {{- with .Values.slack.token -}}
    {{- $_ := set $data "SLACK_TOKEN" . -}}
  {{- end -}}
  {{- with .Values.slack.channel -}}
    {{- $_ := set $data "SLACK_CHANNEL" . -}}
  {{- end -}}
  {{- with .Values.alertmanager.url -}}
    {{- $_ := set $data "ALERTMANAGER_URL" . -}}
  {{- end -}}
  {{- with .Values.alertmanager.user -}}
    {{- $_ := set $data "ALERTMANAGER_USER" . -}}
  {{- end -}}
  {{- with .Values.alertmanager.password -}}
    {{- $_ := set $data "ALERTMANAGER_PASSWORD" . -}}
  {{- end -}}
  {{- toYaml $data | nindent 2 }}
{{- end }}
