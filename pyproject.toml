[project]
name = "ingress-exposure-checker"
version = "0.1.0"
description = "Scan publicly exposed Ingress endpoints for no-auth and default-credential vulnerabilities"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "youjing", email = "youjing@gmail.com" }]
keywords = ["security", "kubernetes", "ingress", "exposure", "swagger", "actuator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "jinja2>=3.1",
    "mmh3>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "build>=1.2",
]

[project.scripts]
iec = "iec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iec"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
